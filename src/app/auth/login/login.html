<div class="min-h-screen w-full bg-img bg-cover bg-center bg-no-repeat flex items-center justify-center relative overflow-hidden">
  
  <div class="w-full max-w-7xl px-6 md:px-12 grid grid-cols-1 lg:grid-cols-12 items-center gap-8 z-10">
    
    <div class="hidden lg:block lg:col-span-5"></div>

    <div class="col-span-1  items-center lg:col-span-6 w-full max-w-md mx-auto">
      
      <div class="flex justify-start mb-6">
        <img 
          src="assets/images/LOGO (1).png" 
          class="h-20 md:h-24 object-contain" 
          alt="DevicePulse Logo"
        />
      </div>

      <div class="w-full bg-white rounded-2xl border border-sky-100 shadow-xl px-8 py-8 relative">
        
        <div class="absolute -left-2.5 top-11 w-5 h-5 rounded-full bg-[#0B7FC3] border-4 border-white shadow-sm"></div>

        <h2 class="text-2xl md:text-3xl font-bold text-title mb-6 tracking-wide">
          Welcome To DevicePulse
        </h2>

        <form [formGroup]="loginForm" class="space-y-4">
          
          <div>
            <input
              type="text"
              formControlName="userName"
             placeholder="Enter your username"
              class="w-full px-4 py-3 bg-[#EAF1F6] text-gray-700 placeholder-gray-400 font-medium rounded-lg text-sm border-0 focus:outline-none focus:ring-2 focus:ring-sky-400 transition duration-150 h-[45px]"
            />
            <p 
              class="text-red-500 text-xs mt-1 pl-1" 
              *ngIf="loginForm.get('userName')?.hasError('required') && loginForm.get('userName')?.touched">
              User name is required
            </p>
          </div>

          <div class="relative">
            <input
              [type]="showpassword ? 'password' : 'text'"
              formControlName="password"
              placeholder="Enter your password"
              class="w-full px-4 py-3 bg-[#EAF1F6] text-gray-700 placeholder-gray-400 font-medium rounded-lg text-sm border-0 pr-12 focus:outline-none focus:ring-2 focus:ring-sky-400 transition duration-150 h-[45px]"
            />
            <button
  type="button"
  (click)="showPassword()"
  class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-500 hover:text-gray-700 focus:outline-none"
>
  <mat-icon>
    {{ showpassword ? 'visibility' : 'visibility_off' }}
  </mat-icon>
</button>
            
            <p 
              class="text-red-500 text-xs mt-1 pl-1" 
              *ngIf="loginForm.get('password')?.hasError('required') && loginForm.get('password')?.touched">
              Password is required
            </p>
          </div>
<!-- 
          <div class="text-xs text-sky-600 font-medium cursor-pointer pl-1 hover:underline">
            Forgot Password ?
          </div> -->

          <div class="pt-2">
            <button
              type="submit"
              (click)="login()"
              class="loginBtn w-full text-white font-semibold rounded-lg text-sm transition duration-150 shadow-md"
            >
              Login
            </button>
          </div>

          <p class="text-[10px]  font-medium text-center mt-4 leading-relaxed suggest">
            By continuing, you agree to DevicePulse <span class="underline cursor-pointer">Terms of Use</span> and <span class="underline cursor-pointer">Privacy Notice</span>.
          </p>

         <div class="text-center text-xs font-bold text-title mt-3">
  Version 1.3
</div>

        </form>

      </div>
    </div>

  </div>
</div>
